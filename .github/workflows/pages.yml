name: Publish repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Regenerate Packages/Release from whatever .debs are committed, so a
      # forgotten local re-index can never publish a stale or mismatched index.
      - name: Rebuild package index
        run: python tools/build_repo.py --root repo

      - name: Fail if the index is empty
        run: test -s repo/Packages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - id: deploy
        uses: actions/deploy-pages@v4
